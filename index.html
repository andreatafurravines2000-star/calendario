<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#6d4aff">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ff;--card:#fff;--tx:#1d1740;--mu:#6b668a;--pr:#6d4aff;--pr2:#ff4fa3;--bd:#e3dcff;--ok:#16a34a;--bad:#e11d48}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#120e2b;--card:#1c1740;--tx:#f1eeff;--mu:#a49fcb;--bd:#322b63}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#120e2b;--card:#1c1740;--tx:#f1eeff;--mu:#a49fcb;--bd:#322b63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
header h1{margin:0;font-size:26px;background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
header small{color:var(--mu);display:block}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-weight:600;cursor:pointer}
nav button.on{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mu);display:block;margin:6px 0 2px}
.btn{padding:11px 16px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;font-weight:700;cursor:pointer;margin-top:10px}
.g{background:transparent;color:var(--bad);border:1px solid var(--bd);padding:6px 10px;margin:0;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.it:first-child{border-top:0}
.it div{flex:1;min-width:0}.it b{display:block}.it span{color:var(--mu);font-size:13px}
.done b{text-decoration:line-through;opacity:.5}.late span.d{color:var(--bad);font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
h3{margin:0 0 6px;font-size:15px;color:var(--pr)}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#m>div{background:var(--card);border-radius:20px;padding:24px;max-width:360px;text-align:center;animation:s .5s infinite alternate}
@keyframes s{to{transform:scale(1.04)}}
.em{text-align:center;color:var(--mu);padding:10px}
</style></head><body><div class="w">
<header>
<svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><rect x="12" y="16" width="40" height="36" rx="7" fill="#fff"/><rect x="12" y="16" width="40" height="11" rx="6" fill="#ffd54a"/><rect x="21" y="10" width="5" height="12" rx="2.5" fill="#fff"/><rect x="38" y="10" width="5" height="12" rx="2.5" fill="#fff"/><path d="M22 40l7 7 14-14" stroke="#6d4aff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div><h1>Calendario</h1><small id="hoy"></small></div></header>
<nav><button data-t="p" class="on">Pendientes</button><button data-t="h">Horario</button><button data-t="a">Agregar</button></nav>
<div id="p"></div>
<div id="h" hidden></div>
<div id="a" hidden>
<div class="c"><h3>Nueva tarea o entrega</h3>
<label>Título</label><input id="tt" placeholder="Ej. Informe de Física">
<div class="row"><div><label>Tipo</label><select id="ty"><option>Tarea</option><option>Trabajo</option><option>Examen</option><option>Exposición</option><option>Otro</option></select></div>
<div><label>Fecha y hora de entrega</label><input id="td" type="datetime-local"></div>
<div><label>Avisar antes</label><select id="tr"><option value="0">A la hora</option><option value="15">15 min</option><option value="60">1 hora</option><option value="180">3 horas</option><option value="1440" selected>1 día</option><option value="2880">2 días</option></select></div></div>
<button class="btn" id="ba">Guardar tarea</button></div>
<div class="c"><h3>Clase del horario</h3>
<label>Curso</label><input id="cn" placeholder="Ej. Cálculo II">
<div class="row"><div><label>Día</label><select id="cd"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></div>
<div><label>Inicio</label><input id="cs" type="time" value="08:00"></div><div><label>Fin</label><input id="ce" type="time" value="10:00"></div></div>
<label>Aula (opcional)</label><input id="cr">
<button class="btn" id="bc">Guardar clase</button></div>
<div class="c"><h3>Alarmas</h3><span class="tag" id="ns"></span><br><button class="btn" id="bn">Activar sonido y notificaciones</button>
<p style="color:var(--mu);font-size:13px;margin:8px 0 0">Las alarmas suenan mientras la app esté abierta. Las clases avisan 10 minutos antes.</p></div>
</div></div>
<div id="m"><div><div style="font-size:48px">⏰</div><h2 id="mt" style="margin:6px 0"></h2><p id="mp" style="color:var(--mu)"></p><button class="btn" id="mo">Entendido</button></div></div>
<script>
const D=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],$=i=>document.getElementById(i);
let S={c:[],t:[],f:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("cal1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cal1",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
$("hoy").textContent=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
function render(){
const now=Date.now(),ts=[...S.t].sort((a,b)=>new Date(a.d)-new Date(b.d));
const row=t=>{const late=!t.ok&&new Date(t.d)<now;return `<div class="it ${t.ok?"done":""} ${late?"late":""}"><input type="checkbox" style="width:22px" ${t.ok?"checked":""} data-k="${t.id}"><div><b>${esc(t.n)}</b><span class="d">${fmt(t.d)}${late?" · vencida":""}</span> <span class="tag">${esc(t.y)}</span></div><button class="btn g" data-x="${t.id}">✕</button></div>`};
const pend=ts.filter(t=>!t.ok),fin=ts.filter(t=>t.ok);
const hoy=S.c.filter(c=>c.day==new Date().getDay()).sort((a,b)=>a.s.localeCompare(b.s));
$("p").innerHTML=`<div class="c"><h3>Clases de hoy</h3>${hoy.map(c=>`<div class="it"><div><b>${esc(c.n)}</b><span>${c.s} – ${c.e} ${c.r?"· "+esc(c.r):""}</span></div></div>`).join("")||'<div class="em">Sin clases hoy 🎉</div>'}</div>
<div class="c"><h3>Tareas y entregas</h3>${pend.map(row).join("")||'<div class="em">Nada pendiente. Agrega una en la pestaña “Agregar”.</div>'}</div>${fin.length?`<div class="c"><h3>Completadas</h3>${fin.map(row).join("")}</div>`:""}`;
$("h").innerHTML=D.slice(1).concat(D[0]).map((n,i)=>{const dn=(i+1)%7,l=S.c.filter(c=>c.day==dn).sort((a,b)=>a.s.localeCompare(b.s));
return `<div class="c"><h3>${n}</h3>${l.map(c=>`<div class="it"><div><b>${esc(c.n)}</b><span>${c.s} – ${c.e} ${c.r?"· "+esc(c.r):""}</span></div><button class="btn g" data-xc="${c.id}">✕</button></div>`).join("")||'<div class="em">Libre</div>'}</div>`}).join("");
$("ns").textContent=("Notification" in window?"Notificaciones: "+Notification.permission:"Solo alarma en pantalla");
}
document.body.addEventListener("click",e=>{const t=e.target,k=t.dataset;
if(k.k){const x=S.t.find(a=>a.id==k.k);x.ok=t.checked;save();render()}
if(k.x){S.t=S.t.filter(a=>a.id!=k.x);save();render()}
if(k.xc){S.c=S.c.filter(a=>a.id!=k.xc);save();render()}
if(k.t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b==t));["p","h","a"].forEach(i=>$(i).hidden=i!=k.t)}});
$("ba").onclick=()=>{const n=$("tt").value.trim(),d=$("td").value;if(!n||!d)return alert("Escribe el título y la fecha.");
S.t.push({id:Date.now(),n,d,y:$("ty").value,r:+$("tr").value,ok:false});$("tt").value="";save();render();ctx()};
$("bc").onclick=()=>{const n=$("cn").value.trim();if(!n)return alert("Escribe el nombre del curso.");
S.c.push({id:Date.now(),n,day:+$("cd").value,s:$("cs").value,e:$("ce").value,r:$("cr").value});$("cn").value="";$("cr").value="";save();render()};
let ac,q=[],tm;
function ctx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(){try{ctx();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type="square";o.frequency.value=880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function ring(title,txt){q.push([title,txt]);show()}
function show(){if(!q.length||$("m").style.display=="flex")return;const[a,b]=q.shift();$("mt").textContent=a;$("mp").textContent=b;$("m").style.display="flex";
beep();tm=setInterval(()=>{beep();navigator.vibrate&&navigator.vibrate(300)},1200);
try{if(Notification.permission=="granted")new Notification(a,{body:b})}catch(e){}}
$("mo").onclick=()=>{clearInterval(tm);$("m").style.display="none";show()};
$("bn").onclick=()=>{ctx();beep();try{Notification.requestPermission().then(render)}catch(e){}};
function check(){const n=Date.now(),td=new Date().toDateString();let ch=false;
S.t.forEach(t=>{if(t.ok)return;const due=new Date(t.d).getTime(),tr=due-t.r*6e4,k="t"+t.id;
if(n>=tr&&n<due+864e5&&!S.f[k]){S.f[k]=1;ch=true;ring("Recordatorio: "+t.n,t.y+" · entrega "+fmt(t.d))}});
S.c.forEach(c=>{if(c.day!=new Date().getDay())return;const[h,m]=c.s.split(":"),st=new Date();st.setHours(h,m,0,0);const k="c"+c.id+td;
if(n>=st-6e5&&n<st.getTime()+36e5&&!S.f[k]){S.f[k]=1;ch=true;ring("Clase en 10 min: "+c.n,c.s+(c.r?" · "+c.r:""))}});
if(ch){save();render()}}
render();check();setInterval(check,10000);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
